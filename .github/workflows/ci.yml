name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,web]"
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t safe-swe-lite:ci .
      - run: docker run -d --name smoke -p 8000:8000 safe-swe-lite:ci
      - run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - run: docker stop smoke